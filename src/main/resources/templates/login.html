<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign in')}"></head><body>
<header th:replace="~{fragments :: header}"></header>
<main class="shell narrow"><p class="eyebrow">Your workspace</p><h1>Sign in</h1>
    <p class="notice error" role="alert" th:if="${param.error}">Username or password was not accepted.</p>
    <p class="notice" role="status" th:if="${param.registered}">Account created. Sign in to continue.</p>
    <p class="notice" role="status" th:if="${param.logout}">You have signed out.</p>
    <form class="card stack" th:action="@{/login}" method="post">
        <div><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required></div>
        <div><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <div><button type="submit">Sign in</button></div>
        <p class="muted">New here? <a th:href="@{/register}">Create an account</a>.</p>
    </form>
</main></body></html>
